<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Magic Pointer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header>
      <div class="logo">
        <span class="logo-dot"></span>
        <span class="logo-text">Magic Pointer</span>
      </div>
      <div class="version">v1.1</div>
    </header>

    <main>
      <div class="status-card" id="statusCard">
        <div class="status-indicator" id="statusIndicator"></div>
        <div class="status-info">
          <div class="status-label">État</div>
          <div class="status-value" id="statusValue">Chargement…</div>
        </div>
      </div>

      <div class="provider-info" id="providerInfo">
        <div class="provider-label">Moteur IA actif</div>
        <div class="provider-name" id="providerName">—</div>
        <div class="provider-model" id="providerModel">—</div>
      </div>

      <!-- Boutons d'action principaux -->
      <div class="actions-grid">
        <button class="btn-action btn-primary" id="activate">
          <div class="btn-action-icon">✂️</div>
          <div class="btn-action-content">
            <div class="btn-action-title">Sélection</div>
            <div class="btn-action-shortcut"><kbd>Alt</kbd>+<kbd>M</kbd></div>
          </div>
        </button>

        <button class="btn-action" id="captureFull">
          <div class="btn-action-icon">📐</div>
          <div class="btn-action-content">
            <div class="btn-action-title">Toute la page</div>
            <div class="btn-action-shortcut"><kbd>Alt</kbd>+<kbd>W</kbd></div>
          </div>
        </button>
      </div>

      <div class="info-row">
        💡 Clic droit sur un lien → 🔍 <strong>Aperçu IA</strong>
      </div>

      <div class="quick-actions">
        <button class="action-btn" id="openOptions">⚙️ Configuration</button>
        <button class="action-btn" id="changeProvider">🔄 Changer moteur</button>
      </div>
    </main>

    <footer>
      <a href="#" id="helpLink">Aide</a>
      <span class="separator">·</span>
      <a href="#" id="aboutLink">À propos</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
