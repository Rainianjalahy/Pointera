<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Magic Pointer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header>
      <div class="logo">
        <span class="logo-dot"></span>
        <span class="logo-text">Magic Pointer</span>
      </div>
      <div class="version">v1.0</div>
    </header>

    <main>
      <div class="status-card" id="statusCard">
        <div class="status-indicator" id="statusIndicator"></div>
        <div class="status-info">
          <div class="status-label">État</div>
          <div class="status-value" id="statusValue">Chargement…</div>
        </div>
      </div>

      <div class="provider-info" id="providerInfo">
        <div class="provider-label">Moteur IA actif</div>
        <div class="provider-name" id="providerName">—</div>
        <div class="provider-model" id="providerModel">—</div>
      </div>

      <button class="btn-activate" id="activate">
        <span class="kbd">Alt</span>
        <span class="plus">+</span>
        <span class="kbd">M</span>
        <span class="label">pour activer</span>
      </button>

      <div class="quick-actions">
        <button class="action-btn" id="openOptions">
          ⚙️ Configuration
        </button>
        <button class="action-btn" id="changeProvider">
          🔄 Changer de moteur
        </button>
      </div>
    </main>

    <footer>
      <a href="#" id="helpLink">Aide</a>
      <span class="separator">·</span>
      <a href="#" id="aboutLink">À propos</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
